# Toy 2-scene smoke test for the U-RESfM multi-scene pipeline (spec acceptance #2):
# 2 training epochs, evaluation every epoch, best checkpoint written.
# Scenes chosen small on purpose: 5016 (28 cams), 1001 (285 cams).

exp_name = uresfm_multiscene_toy
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/uresfm_toy"
num_iter = 1
random_seed = 20
num_jobs = 1
num_gpus = 1
general
{
    stage = "3"
}
dataset
{
    dataset = "megadepth"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 2
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["5016", "1001"]
    validation_set = ["5016", "1001"]
    test_set = ["5016"]
}
model
{
    type = "SetOfSet.DeepSetOfSetOutliersNet"
    num_features = 256
    num_blocks = 2
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
    use_layer_norm = True
    use_residual = True
    dropout_rate = 0.1
}
train
{
    lr = 1e-4
    # the loop runs epochs [resuming_epoch+1, num_epochs) = 1..2 -> 2 training epochs
    num_epochs = 3
    scheduler_milestone = [10000]
    gamma = 0.9
    eval_intervals = 1
    early_stopping_patience = 0
    output_mode = 3
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False
    validation_metric_fine_tuning = ["our_repro"]

    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = CombinedLoss
    func_tuning = ESFMLoss

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.3

    infinity_pts_margin = 1e-4
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    inlier_percentile = 20.0
    outlier_percentile = 80.0
    min_confident_samples = 10
    min_threshold_separation = 0.5
    warmup_epochs = 10

    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    # BA off for the toy run: after only 2 epochs the model is near-random and
    # colmap BA can yield an empty reconstruction, which crashes
    # ba_advanced.pycolmap_to_batch_matrix (max() of empty point3D_ids). The real
    # 27-scene conf keeps BA (final eval only, on a trained model).
    run_ba = False
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0  # RESfM paper/conf value (multi-scene protocol)
}
