# U-ESFM multi-scene ADAPTIVE arm - the report's headline multi-scene experiment
# (Future Work p.24: "Most importantly, evaluate our Adaptive Confidence-Weighted
# Outlier Loss Function method in multi scene learning setting and compare the
# performance with RESFM"). Implemented per the report's spec: the outlier detector
# is trained ONLY by the confident-pseudo-label BCE; the reprojection weighting
# uses detached scores (the earlier collapse traced to that gradient leak).

# U-RESfM multi-scene training: RESfM's 27 MegaDepth training scenes, unsupervised
# CombinedLoss (adaptive confidence-weighted outlier loss + weighted reprojection).
# Entry point: multiple_scenes_learning.py (see RUN_MULTISCENE.md).
# Scene split copied from resfm-main-orig/code/confs/RESFM_Learning.conf (" new"
# suffix stripped to match this repo's datasets/megadepth/<scan>.npz naming; the
# original 0176_300/0299_300 validation subsets are not in this repo, so the full
# scenes are used instead).

exp_name = uesfm_multiscene_27scenes_adaptive
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/uesfm_27scenes_adaptive"
num_iter = 1
random_seed = 20
# Safe on a fresh start (falls through when no checkpoint exists); on relaunch
# after waic-risk preemption, training resumes from the latest models_all checkpoint.
resume = true
num_jobs = 1
num_gpus = 1
general
{
    # Not a single-scene stage-1/2 run; "3" also disables the per-scene
    # reprojection_errors.npy dump in evaluation.compute_errors (stage "1" only).
    stage = "3"
}
dataset
{
    dataset = "megadepth"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 4
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["0156", "0860", "0412", "0217", "0181", "0285", "0214", "0041", "0275", "0186", "0474", "0476", "0768", "0204", "0733", "0047", "0229", "0175", "0349", "0107", "0303", "0058", "0286", "0062", "0478", "0271", "0360"]
    validation_set = ["5015", "0176", "0299", "0290"]
    test_set = ["5015"]
}
model
{
    type = "SetOfSet.DeepSetOfSetOutliersNet"
    num_features = 256
    num_blocks = 2
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
    use_layer_norm = True
    use_residual = True
    dropout_rate = 0.1
}
train
{
    lr = 1e-4  # U-RESfM single-scene-tuned value for the Deep model (comparison branch)
    num_epochs = 20000
    scheduler_milestone = [10000, 12000, 14000, 16000, 18000]
    gamma = 0.9
    eval_intervals = 500
    early_stopping_patience = 0
    output_mode = 3  # adaptive loss: camera/point heads + outlier detector
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False  # reprojection error: lower is better
    validation_metric_fine_tuning = ["our_repro"]

    # Test-time fine-tune stage parameters (RESfM protocol: ~1K steps per test scene).
    # fine_tune_after_training stays False here — the TTT experiment is a separate task.
    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = CombinedLoss          # Adaptive Confidence-Weighted Outlier Loss (report sec. 2.2.2,
                                 # = alpha*plain ESFM loss + beta*pseudo-label BCE; scores used at test time)
    func_tuning = ESFMLoss       # fine-tune stage default (TTT task will swap this)

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.3

    infinity_pts_margin = 1e-4
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    # AdaptiveConfidenceWeightedOutliersLoss parameters (per-scene, per-forward)
    inlier_percentile = 20.0
    outlier_percentile = 80.0
    min_confident_samples = 10
    min_threshold_separation = 0.5
    warmup_epochs = 10

    # Per-forward pandas/CSV loss tracking is O(steps^2) — keep off for multi-scene.
    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0  # RESfM paper/conf value (multi-scene protocol)
}
