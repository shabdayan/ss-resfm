# VANILLA ESFM baseline (TASK_esfm_vanilla_baseline Step 2): the ORIGINAL
# SetOfSetNet class (vanilla SetOfSetBlock: plain layers + mean-subtraction
# NormalizationLayer; no residuals, no SparseLayerNorm, no dropout, no outlier
# head) with plain ESFMLoss. Class choice evidence: DeepSetOfSetBlock has an
# unconditional 0.707 residual scaling and SparseLayerNorm placement that flags
# cannot remove, so Deep-with-flags-off is NOT byte-vanilla; SetOfSetNet uses
# the untouched original block. Protocol identical to the R11 grid shallow
# lr1e-3 cell (27 scenes, 20k epochs, seed 20, RESfM LR ladder); upstream
# ESFM's own Learning_Euc.conf confirms 1x3/256/use_skip=False/lr 1e-3.
# Kaiming init does NOT apply (depth gate: 3 layers -> default init).

exp_name = esfm_vanilla_hardonly_s20
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/esfm_vanilla_hardonly_s20"
num_iter = 1
random_seed = 20
# Safe on a fresh start (falls through when no checkpoint exists); on relaunch
# after waic-risk preemption, training resumes from the latest models_all checkpoint.
resume = true
num_jobs = 1
num_gpus = 1
general
{
    # Not a single-scene stage-1/2 run; "3" also disables the per-scene
    # reprojection_errors.npy dump in evaluation.compute_errors (stage "1" only).
    stage = "3"
}
dataset
{
    dataset = "onedsfm_id"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 2
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["Gendarmenmarkt", "Trafalgar"]
    validation_set = ["Piccadilly"]
    test_set = ["Roman_Forum"]
}
model
{
    type = "SetOfSet.SetOfSetNet"
    num_features = 256
    num_blocks = 1
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
    use_layer_norm = False
    use_residual = False
    dropout_rate = 0.0
}
train
{
    lr = 1e-3  # RESfM's value for this shallow architecture (RESFM_Learning.conf)
    num_epochs = 20000
    scheduler_milestone = [10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 18000, 19000, 20000]  # RESfM's schedule
    gamma = 0.9
    eval_intervals = 500
    early_stopping_patience = 0
    output_mode = 1  # vanilla ESFM: cameras/points only, no outlier head exists
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False  # reprojection error: lower is better
    validation_metric_fine_tuning = ["our_repro"]

    # Test-time fine-tune stage parameters (RESfM protocol: ~1K steps per test scene).
    # fine_tune_after_training stays False here — evaluation is a separate fan-out.
    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = ESFMLoss              # vanilla ESFM: plain unsupervised reprojection
                                 
    func_tuning = ESFMLoss       # fine-tune stage default (TTT task swaps this)

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.3

    infinity_pts_margin = 1e-4
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    # AdaptiveConfidenceWeightedOutliersLoss parameters (per-scene, per-forward)
    inlier_percentile = 20.0
    outlier_percentile = 80.0
    min_confident_samples = 10
    min_threshold_separation = 0.0  # 0.5 default is pixel-scale; normalized errors are ~0.01-0.2 (see fe55bf0)
    warmup_epochs = 10

    # Per-forward pandas/CSV loss tracking is O(steps^2) — keep off for multi-scene.
    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0  # RESfM paper/conf value (multi-scene protocol)
}
