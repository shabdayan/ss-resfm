# RESfM supervised multi-scene sanity conf (spec acceptance #3).
# NOTE: this repo never contained RESfM's original RESFM_Learning.conf, and the name
# `CombinedLoss` here denotes the UNSUPERVISED U-RESfM loss. This conf reproduces the
# original supervised setup through `CombinedLossSupervised` (a faithful port of the
# original class — outlier-weighted reprojection + GT-label balanced BCE) and the
# original SetOfSetOutliersNet architecture. Validation uses a geometric metric
# because this repo's epoch_evaluation no longer computes label-based "Accuracy".
# Scene lists kept tiny — this conf exists to verify the supervised path still runs.

exp_name = resfm_multiscene_supervised_sanity
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-resfm/code/results/multiscene/resfm_supervised_sanity"
num_iter = 1
random_seed = 20
num_jobs = 1
num_gpus = 1
general
{
    stage = "3"
}
dataset
{
    dataset = "megadepth"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 2
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["5016", "1001"]
    validation_set = ["5016"]
    test_set = ["5016"]
}
model
{
    # RESfM original architecture
    type = "SetOfSet.SetOfSetOutliersNet"
    num_features = 256
    num_blocks = 1
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
}
train
{
    lr = 1e-3
    num_epochs = 3
    scheduler_milestone = [10000]
    gamma = 0.9
    eval_intervals = 1
    early_stopping_patience = 0
    output_mode = 3
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False
    validation_metric_fine_tuning = ["our_repro"]

    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = CombinedLossSupervised  # GT-label BCE + weighted reprojection (RESfM original)
    func_tuning = ESFMLoss

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.1  # original RESFM_Learning.conf value

    infinity_pts_margin = 1e-3
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0
}
