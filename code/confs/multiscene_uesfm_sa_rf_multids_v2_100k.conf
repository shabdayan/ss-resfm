# U-ESFM multi-scene REPORT-FAITHFUL adaptive arm, SHALLOW (1x3) twin of
# multiscene_uesfm_adaptive_reportfaithful.conf. Same report-faithful loss config
# (report sec 2.2.2, p11; hyperparams p14-15):
#   - loss.reproj_weighting = "weighted"  -> outlier head scores WEIGHT the reproj
#     loss (ESFMLoss_weighted), restoring the report's head<->geometry coupling.
#   - classification_loss_weight (beta) = 1.0 (report headline alpha=1, beta=1).
#   - min_threshold_separation left UNSET -> scale-aware floor (0.25 x median err).
# Only difference from the deep twin: num_blocks = 1 (shallow, ~RESfM capacity).
# NOTE: 'weighted' uses NON-detached scores (report-literal); if Nr collapses,
# switch loss.reproj_weighting to "weighted_detach" (collapse guard).

exp_name = uesfm_multids_v2_sa_rf_100k
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/uesfm_multids_v2_sa_rf_100k"
num_iter = 1
random_seed = 20
resume = true
num_jobs = 1
num_gpus = 1
general
{
    stage = "3"
}
dataset
{
    dataset = "multitrain"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 4
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["0156", "0860", "0412", "0217", "0181", "0285", "0214", "0041", "0275", "0186", "0474", "0476", "0768", "0204", "0733", "0047", "0229", "0175", "0349", "0107", "0303", "0058", "0286", "0062", "0478", "0271", "0360", "courtyard", "delivery_area", "electro", "facade", "kicker", "office", "pipes", "playground", "relief", "relief_2", "terrace", "terrains", "dino", "corridor", "dunster", "merton.a", "merton.b", "merton.c", "wadham", "barn", "caterpillar", "courthouse", "ignatius", "meetingroom", "truck"]
    validation_set = ["5015", "0176", "0299", "0290"]
    test_set = ["5015"]
}
model
{
    type = "SetOfSet.DeepSetOfSetOutliersNet"
    num_features = 256
    num_blocks = 1   # SHALLOW arm (1 block x 3 layers, ~RESfM capacity)
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
    use_layer_norm = True
    use_residual = True
    dropout_rate = 0.1
}
train
{
    lr = 1e-4
    num_epochs = 100000
    scheduler_milestone = [50000, 60000, 70000, 80000, 90000]
    gamma = 0.9
    eval_intervals = 500
    early_stopping_patience = 0
    output_mode = 3  # adaptive loss: camera/point heads + outlier detector
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False
    validation_metric_fine_tuning = ["our_repro"]

    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = CombinedLoss          # Adaptive Confidence-Weighted Outlier Loss (report sec. 2.2.2)
    func_tuning = ESFMLoss

    reproj_weighting = "weighted"   # report-faithful: head scores weight the reproj loss
    reproj_loss_weight = 1.0        # alpha = 1
    classification_loss_weight = 1.0  # beta = 1 (report headline)

    infinity_pts_margin = 1e-4
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    inlier_percentile = 20.0
    outlier_percentile = 80.0
    min_confident_samples = 10
    # min_threshold_separation left unset -> scale-aware floor (0.25 x median error).
    warmup_epochs = 10

    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0
}
