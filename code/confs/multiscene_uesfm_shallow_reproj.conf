# R11 ablation grid (SPEC_uesfm_combined §2.C), arm: SHALLOW x plain-reprojection.
# Shallow = num_blocks 1 x block_size 3 (~RESfM capacity, per the spec); same class
# (DeepSetOfSetOutliersNet) so the code path is identical across the grid.
# The DEEP arms of the 2x2 are the existing confs (NOT duplicated here):
#   deep x reproj   -> confs/multiscene_uesfm_stage1.conf   (results/multiscene/uesfm_27scenes_stage1)
#   deep x adaptive -> confs/multiscene_uesfm_adaptive.conf (results/multiscene/uesfm_27scenes_adaptive)
# NOTE (spec contradiction, recorded per ground rules): the spec text says deep =
# "5 blocks x 2 layers", but the Table-1 U-ESFM model is 2 blocks x 3 layers — the
# grid uses 2x3 so the deep arm IS the headline model.
# Everything below except the model size and exp identifiers is byte-identical to
# multiscene_uesfm_stage1.conf (identical budget, seed, schedule — R11 requirement).

exp_name = uesfm_multiscene_27scenes_shallow_reproj
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/uesfm_27scenes_shallow_reproj"
num_iter = 1
random_seed = 20
# Safe on a fresh start (falls through when no checkpoint exists); on relaunch
# after waic-risk preemption, training resumes from the latest models_all checkpoint.
resume = true
num_jobs = 1
num_gpus = 1
general
{
    # Not a single-scene stage-1/2 run; "3" also disables the per-scene
    # reprojection_errors.npy dump in evaluation.compute_errors (stage "1" only).
    stage = "3"
}
dataset
{
    dataset = "megadepth"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 4
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["0156", "0860", "0412", "0217", "0181", "0285", "0214", "0041", "0275", "0186", "0474", "0476", "0768", "0204", "0733", "0047", "0229", "0175", "0349", "0107", "0303", "0058", "0286", "0062", "0478", "0271", "0360"]
    validation_set = ["5015", "0176", "0299", "0290"]
    test_set = ["5015"]
}
model
{
    type = "SetOfSet.DeepSetOfSetOutliersNet"
    num_features = 256
    num_blocks = 1   # SHALLOW arm: 1 block x 3 layers (~RESfM capacity)
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
    use_layer_norm = True
    use_residual = True
    dropout_rate = 0.1
}
train
{
    lr = 1e-4  # U-RESfM single-scene-tuned value for the Deep model (comparison branch)
    num_epochs = 20000
    scheduler_milestone = [10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 18000, 19000, 20000]  # RESfM schedule (uniform across all arms)
    gamma = 0.9
    eval_intervals = 500
    early_stopping_patience = 0
    output_mode = 1  # plain-reprojection arm: camera/point heads only
    validation_metric = ["our_repro"]
    validation_metric_higher_is_better = False  # reprojection error: lower is better
    validation_metric_fine_tuning = ["our_repro"]

    # Test-time fine-tune stage parameters (RESfM protocol: ~1K steps per test scene).
    # fine_tune_after_training stays False here — the TTT experiment is a separate task.
    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = ESFMLoss              # plain unsupervised reprojection loss
    func_tuning = ESFMLoss       # fine-tune stage default (TTT task will swap this)

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.3

    infinity_pts_margin = 1e-4
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    # AdaptiveConfidenceWeightedOutliersLoss parameters (per-scene, per-forward)
    inlier_percentile = 20.0
    outlier_percentile = 80.0
    min_confident_samples = 10
    min_threshold_separation = 0.5
    warmup_epochs = 10

    # Per-forward pandas/CSV loss tracking is O(steps^2) — keep off for multi-scene.
    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0  # RESfM paper/conf value (multi-scene protocol)
}
