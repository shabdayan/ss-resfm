# RESfM-SHALLOW (from scratch): faithful reproduction of the authors' EXACT
# architecture (SetOfSetOutliersNet 1x3) + supervised recipe
# (CombinedLossSupervised, weights 1.0/0.1), lr 1e-3. Same 27 MegaDepth
# scenes/budget as resfm_deep. Separates 'their method' from 'their checkpoint
# on their tracks' -- RESfM's recipe trained on OUR track distribution.
# RESfM-DEEP multi-scene arm — RESfM's ORIGINAL supervised training recipe
# (CombinedLossSupervised = outlier-weighted reprojection + GT-label balanced BCE,
# ported from resfm-main-orig) at the SAME depth as the U-ESFM deep arms
# (Deep 2x3: residual + SparseLayerNorm + dropout 0.1), so the paper-style
# tables can compare ESFM / U-ESFM / RESfM at matched capacity.
# Differences vs resfm-main-orig/code/confs/RESFM_Learning.conf:
#   - model: DeepSetOfSetOutliersNet 2x3 (theirs: SetOfSetOutliersNet 1x3)
#   - lr: 1e-4 (their 1e-3 is shallow-tuned; all deep arms in this repo train
#     at 1e-4 — the deep-tuned value from the single-scene comparison branch)
#   - loss.func = CombinedLossSupervised (this repo reserves `CombinedLoss`
#     for the unsupervised U-ESFM adaptive loss)
# Everything else (weights 1.0/0.1, output_mode 3, split, budget, protocol
# knobs) mirrors the U-ESFM deep training confs for a controlled comparison.
# Entry point: multiple_scenes_learning.py (see RUN_MULTISCENE.md).

exp_name = resfm_multids_v2_af
results_path = "/home/projects/bagon/ortalda/MVG/final-project/u-esfm/code/results/multiscene/resfm_multids_v2_af"
num_iter = 1
random_seed = 20
# Safe on a fresh start (falls through when no checkpoint exists); on relaunch
# after waic-risk preemption, training resumes from the latest models_all checkpoint.
resume = true
num_jobs = 1
num_gpus = 1
general
{
    stage = "3"
}
dataset
{
    dataset = "multitrain"
    use_gt = False
    calibrated = True
    remove_outliers_gt = False
    batch_size = 4
    min_sample_size = 0.1
    max_sample_size = 0.2

    train_set = ["0156", "0860", "0412", "0217", "0181", "0285", "0214", "0041", "0275", "0186", "0474", "0476", "0768", "0204", "0733", "0047", "0229", "0175", "0349", "0107", "0303", "0058", "0286", "0062", "0478", "0271", "0360", "courtyard", "delivery_area", "electro", "facade", "kicker", "office", "pipes", "playground", "relief", "relief_2", "terrace", "terrains", "dino", "corridor", "dunster", "merton.a", "merton.b", "merton.c", "wadham", "barn", "caterpillar", "courthouse", "ignatius", "meetingroom", "truck"]
    validation_set = ["5015", "0176", "0299", "0290"]
    test_set = ["5015"]
}
model
{
    # RESfM's ORIGINAL architecture (matches the released checkpoint): plain
    # SetOfSetOutliersNet, 1 block x 3 layers, 256 features. NO residual/LayerNorm/
    # dropout (those are the Deep-class enhancements used by resfm_deep).
    type = "SetOfSet.SetOfSetOutliersNet"
    num_features = 256
    num_blocks = 1
    block_size = 3
    use_skip = False
    multires = 0
    use_progressive = False
}
train
{
    lr = 1e-3  # authors' shallow value (RESFM_Learning.conf)
    num_epochs = 20000
    scheduler_milestone = [10000, 11000, 12000, 13000, 14000, 15000, 16000, 17000, 18000, 19000, 20000]
    gamma = 0.9
    eval_intervals = 500
    early_stopping_patience = 0
    output_mode = 3  # RESfM: camera/point heads + outlier classifier
    validation_metric = ["Accuracy"]  # authors' selection
    validation_metric_fine_tuning = ["our_repro"]

    fine_tune_after_training = False
    optimization_num_of_epochs = 1001
    optimization_eval_intervals = 250
    optimization_lr = 5e-3
}
loss
{
    func = CombinedLossSupervised  # RESfM original: alpha*outlier-weighted reproj + beta*GT BCE
    func_tuning = ESFMLoss         # fine-tune stage default (RESfM protocol)

    reproj_loss_weight = 1.0
    classification_loss_weight = 0.1  # RESfM_Learning.conf value

    infinity_pts_margin = 1e-3  # authors' value
    normalize_grad = True
    hinge_loss = True
    hinge_loss_weight = 1

    enable_csv_logging = False
}
test
{
    outliers_threshold = 0.6
}
ba
{
    run_ba = True
    repeat = True
    triangulation = False
    only_last_eval = True
    filter_outliers = 5.0  # RESfM paper/conf value (multi-scene protocol)
}
